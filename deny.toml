# cargo-deny: known vulnerabilities, licenses and dependency sources.
# Run locally with `cargo deny check`; CI runs it on every push.

[graph]
# Only the platforms TwinFolders ships on. Linux-only crates (GTK, D-Bus)
# come from Tauri's Linux backend and never end up in a Mac/Windows build.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
all-features = false

[advisories]
# Vulnerabilities always fail. "Unmaintained" notices only fail for crates
# we depend on directly; deep transitive ones are reported but tracked
# upstream (Tauri, keyring).
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with the project's MIT license, plus
# MPL-2.0 (file-level copyleft, used unmodified by Tauri's HTML parser).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common in the Tauri tree; report, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; no git dependencies or other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
