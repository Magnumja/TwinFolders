name: Release

# Builds the installers (macOS .dmg universal, Windows .msi/.exe) and
# attaches them to a DRAFT GitHub release, which a person then publishes.
# Run by pushing a tag like `v0.2.0`, or by hand from the Actions tab
# (then only the build artifacts are produced, no release).
#
# Signing is optional and driven by repository secrets (docs/release.md):
# without them the build still works, unsigned (Gatekeeper/SmartScreen warn).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: frontend dependencies
        working-directory: app
        run: npm ci

      # Exported only when the secret exists: an empty APPLE_* variable
      # would make the bundler try (and fail) to sign.
      - name: Apple signing and notarization (only if configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Signing: on"
            if [ -n "$APPLE_ID" ]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
              echo "Notarization: on"
            fi
          else
            echo "::warning::No Apple certificate configured: the app is ad-hoc signed only (Gatekeeper will warn on first open)."
          fi

      - name: build installers
        working-directory: app
        run: npx tauri build --target ${{ matrix.target }} --ci

      - name: collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          b="target/${{ matrix.target }}/release/bundle"
          find "$b" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} dist-release/ \;
          test -n "$(ls dist-release)"
          cd dist-release
          if command -v sha256sum >/dev/null; then sha256sum * > "SHA256SUMS-$RUNNER_OS.txt"; else shasum -a 256 * > "SHA256SUMS-$RUNNER_OS.txt"; fi
          cat SHA256SUMS-*.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ runner.os }}
          path: dist-release/*
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la out
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "TwinFolders $TAG" \
            --notes "Instaladores para Mac (.dmg, Apple Silicon e Intel) e Windows (.msi ou -setup.exe). Confira os arquivos com SHA256SUMS. Passo a passo no README."
