name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SYNCTHING_VERSION: v2.1.7

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: macos-arm64
            ext: zip
            sha256: 2df075b463231a307c91da657157beaed06383a941ba7ea04d33d536e3c4af38
          - os: windows-latest
            asset: windows-amd64
            ext: zip
            sha256: 3ce7da770f546a8d02b65b2e7ee31f2a3b8b7c3f990ede045590cca4172ecfe1
          - os: ubuntu-latest
            asset: linux-amd64
            ext: tar.gz
            sha256: 2edc416e7ed136b7c858ed5f3f02a3b8316589605e54c380228ceea7acbf0142
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # SHA-256 values are pinned in this file (reviewed in git), not read from
      # the release, so a tampered release asset fails the build.
      - name: Install Syncthing ${{ env.SYNCTHING_VERSION }} (official release, pinned SHA-256)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="syncthing-${{ matrix.asset }}-${SYNCTHING_VERSION}"
          mkdir -p "$RUNNER_TEMP/st" && cd "$RUNNER_TEMP/st"
          gh release download "$SYNCTHING_VERSION" -R syncthing/syncthing \
            --pattern "${name}.${{ matrix.ext }}"
          expected="${{ matrix.sha256 }}"
          if command -v sha256sum >/dev/null; then actual=$(sha256sum "${name}.${{ matrix.ext }}" | awk '{print $1}');
          else actual=$(shasum -a 256 "${name}.${{ matrix.ext }}" | awk '{print $1}'); fi
          test -n "$expected" && test "$expected" = "$actual"
          if [ "${{ matrix.ext }}" = "zip" ]; then unzip -q "${name}.zip"; else tar xzf "${name}.tar.gz"; fi
          bin="$PWD/${name}/syncthing"; [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          # Rust on Windows needs a native path (C:\...), not bash's /d/a/...
          if command -v cygpath >/dev/null; then bin=$(cygpath -w "$bin"); fi
          echo "TWINFOLDERS_SYNCTHING=$bin" >> "$GITHUB_ENV"

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --exclude twinfolders-app --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --exclude twinfolders-app -- --nocapture

      - name: SSH setup scripts (syntax)
        shell: bash
        run: |
          bash -n scripts/ssh-setup-mac.sh
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command '$e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/ssh-setup-windows.ps1",[ref]$null,[ref]$e); if ($e.Count) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 } else { "ssh-setup-windows.ps1: OK" }'
          fi

  # Known vulnerabilities, licenses and sources of every Rust dependency
  # (deny.toml), plus the frontend's runtime npm packages.
  supply-chain:
    name: dependencies (cargo deny, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories bans licenses sources
      - name: npm audit (runtime dependencies)
        working-directory: app
        run: npm audit --omit=dev --audit-level=moderate

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: frontend (tests, typecheck, build)
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
      - name: clippy (Tauri crate)
        run: cargo clippy -p twinfolders-app --all-targets -- -D warnings

  windows-service:
    name: service install/uninstall (Windows Task Scheduler, live)
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Syncthing (pinned SHA-256)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="syncthing-windows-amd64-${SYNCTHING_VERSION}"
          mkdir -p "$RUNNER_TEMP/st" && cd "$RUNNER_TEMP/st"
          gh release download "$SYNCTHING_VERSION" -R syncthing/syncthing --pattern "${name}.zip"
          test "$(sha256sum "${name}.zip" | awk '{print $1}')" = "3ce7da770f546a8d02b65b2e7ee31f2a3b8b7c3f990ede045590cca4172ecfe1"
          unzip -q "${name}.zip"
          echo "ST_BIN=$(cygpath -w "$PWD/${name}/syncthing.exe")" >> "$GITHUB_ENV"
      - name: install -> status -> uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build -p twinfolders-cli
          $tf = ".\target\debug\twinfolders.exe"
          & $tf service install --syncthing $env:ST_BIN
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          $task = Get-ScheduledTask -TaskPath '\TwinFolders\' -TaskName 'Syncthing'
          "Task state: $($task.State)"
          $task.Triggers | Format-List *
          if ($task.Settings.ExecutionTimeLimit -ne 'PT0S') { throw "time limit set" }
          & $tf service status
          # GUI only on loopback
          $l = Get-NetTCPConnection -LocalPort 8385 -State Listen
          $l | Format-Table LocalAddress, LocalPort
          if ($l | Where-Object { $_.LocalAddress -notin @('127.0.0.1','::1') }) { throw "GUI not loopback-only" }
          # API key not on the process command line
          $p = Get-CimInstance Win32_Process -Filter "Name='syncthing.exe'"
          $p | Select-Object ProcessId, CommandLine | Format-List
          if ($p.CommandLine -match 'apikey') { throw "API key on command line" }
          & $tf service uninstall
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed" }
          if (Get-ScheduledTask -TaskPath '\TwinFolders\' -TaskName 'Syncthing' -ErrorAction SilentlyContinue) { throw "task still registered" }
          if (-not (Test-Path "$env:LOCALAPPDATA\TwinFolders\syncthing\config.xml")) { throw "home must be kept" }
          "EVIDENCE: Windows service install/status/uninstall OK"
