name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SYNCTHING_VERSION: v2.1.7

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: macos-arm64
            ext: zip
          - os: windows-latest
            asset: windows-amd64
            ext: zip
          - os: ubuntu-latest
            asset: linux-amd64
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Syncthing ${{ env.SYNCTHING_VERSION }} (official release, checksum verified)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="syncthing-${{ matrix.asset }}-${SYNCTHING_VERSION}"
          mkdir -p "$RUNNER_TEMP/st" && cd "$RUNNER_TEMP/st"
          gh release download "$SYNCTHING_VERSION" -R syncthing/syncthing \
            --pattern "${name}.${{ matrix.ext }}" --pattern "sha256sum.txt.asc"
          expected=$(grep " ${name}.${{ matrix.ext }}\$" sha256sum.txt.asc | awk '{print $1}')
          if command -v sha256sum >/dev/null; then actual=$(sha256sum "${name}.${{ matrix.ext }}" | awk '{print $1}');
          else actual=$(shasum -a 256 "${name}.${{ matrix.ext }}" | awk '{print $1}'); fi
          test -n "$expected" && test "$expected" = "$actual"
          if [ "${{ matrix.ext }}" = "zip" ]; then unzip -q "${name}.zip"; else tar xzf "${name}.tar.gz"; fi
          bin="$PWD/${name}/syncthing"; [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          echo "TWINFOLDERS_SYNCTHING=$bin" >> "$GITHUB_ENV"

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace -- --nocapture
